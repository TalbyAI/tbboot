name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        node-version: [24.12.x, 24.x]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify MVP Windows x64 target
        shell: pwsh
        run: |
          $platform = node -p "process.platform"
          $arch = node -p "process.arch"
          if ($platform -ne "win32" -or $arch -ne "x64") {
            throw "MVP acceptance requires win32/x64; got $platform/$arch"
          }

      - name: Install dependencies
        run: npm ci

      - name: Check Markdown format
        run: npm run check:md

      - name: Check TypeScript and JavaScript quality
        run: npm run check:code

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build CLI entrypoint
        run: npm run build

      - name: Run tests
        run: npm test
